syntax = "proto3";

package raftpb;

// A single Raft log entry
message LogEntry {
  uint64 term  = 1;
  uint64 index = 2;
  bytes  data  = 3;
}

// RequestVote RPC (candidate → all peers)
message RequestVoteArgs {
  uint64 term           = 1;
  uint64 candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
  uint64 lamport_ts     = 5; // Lamport clock for causal ordering
}

message RequestVoteReply {
  uint64 term        = 1;
  bool   vote_granted = 2;
  uint64 lamport_ts  = 3;
}

// AppendEntries RPC (leader → followers) — also used as heartbeat when entries is empty
message AppendEntriesArgs {
  uint64            term           = 1;
  uint64            leader_id      = 2;
  uint64            prev_log_index = 3;
  uint64            prev_log_term  = 4;
  repeated LogEntry entries        = 5;
  uint64            leader_commit  = 6;
  uint64            lamport_ts     = 7;
}

message AppendEntriesReply {
  uint64 term           = 1;
  bool   success        = 2;
  // Fast-backup fields: only set on failure
  uint64 conflict_term  = 3;
  uint64 conflict_index = 4;
  uint64 lamport_ts     = 5;
}

service RaftService {
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc RequestVote  (RequestVoteArgs)   returns (RequestVoteReply);
}
